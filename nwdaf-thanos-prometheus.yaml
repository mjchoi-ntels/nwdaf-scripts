apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  annotations:
    operator.prometheus.io/controller-id: openshift-monitoring/prometheus-operator
  name: nwdaf-thanos
  namespace: openshift-monitoring
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node-role.kubernetes.io/nwdaf
            operator: In
            values:
            - ""
  configMaps:
  - serving-certs-ca-bundle
  - kubelet-serving-ca-bundle
  - metrics-client-ca
  enableAdminAPI: false
  evaluationInterval: 30s
  hostNetwork: false
  image: registry.apps.ocp21.skt.local/nwdaf-images/quay.io-prometheus-prometheus:v2.54.0
  listenLocal: false
  logFormat: logfmt
  logLevel: info
  paused: false
  podMonitorNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: openshift-monitoring
  podMonitorSelector:
    matchLabels:
      release: nwdaf
  portName: http-web
  replicas: 2
  retention: 10d
  routePrefix: /
  scrapeInterval: 30s
  secrets:
  - metrics-client-certs
  securityContext:
    fsGroup: 2000
    runAsGroup: 2000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  serviceAccountName: nwdaf-prometheus
  serviceMonitorNamespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: In
      values:
      - openshift-monitoring
      - gpu-operator
  serviceMonitorSelector:
    matchLabels:
      release: nwdaf
  shards: 1
  storage:
    volumeClaimTemplate:
      spec:
        resources:
          requests:
            storage: 200Gi
        storageClassName: nwdaf-sc-rwo
  thanos:
    blockSize: 2h
    image: quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:4bc85578bc8d51e0252f254f368a363f52a75b0db957757c64d51e36df150dcd
    version: 0.35.0
  tsdb:
    outOfOrderTimeWindow: 0s
  walCompression: true

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nwdaf-thanos-querier
  namespace: openshift-monitoring
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: nwdaf-thanos-querier
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: nwdaf-thanos-querier
    spec:
      containers:
      - args:
        - query
        - --http-address=0.0.0.0:9090
        - --store=dnssrv+_grpc._tcp.nwdaf-thanos-prometheus
        - --query.replica-label=prometheus_replica
        - --query.auto-downsampling
        image: quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:4bc85578bc8d51e0252f254f368a363f52a75b0db957757c64d51e36df150dcd
        imagePullPolicy: IfNotPresent
        name: thanos-querier
        ports:
        - containerPort: 9090
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30

---

apiVersion: v1
kind: Service
metadata:
  name: nwdaf-thanos-prometheus
  namespace: openshift-monitoring
spec:
  clusterIP: None
  clusterIPs:
  - None
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http-web
    port: 9090
    protocol: TCP
    targetPort: http-web
  - name: grpc
    port: 10901
    protocol: TCP
    targetPort: grpc
  selector:
    app.kubernetes.io/instance: nwdaf-thanos
    app.kubernetes.io/name: prometheus
  sessionAffinity: None
  type: ClusterIP

---

apiVersion: v1
kind: Service
metadata:
  namespace: openshift-monitoring
spec:
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 9090
    protocol: TCP
    targetPort: 9090
  selector:
    app: nwdaf-thanos-querier
  sessionAffinity: None
  type: ClusterIP